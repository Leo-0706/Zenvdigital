# ==============================================================================
# Zenv Digital - Production Nginx Reverse Proxy & Edge Defense Configuration
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security telemetry
    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log security;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS & Brute-Force Defense)
    # --------------------------------------------------------------------------
    # General API rate limit: 10MB memory zone, 20 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

    # Strict Auth rate limit: 10MB zone, 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;

    # Admin route scraping limit: 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=admin_lockdown:10m rate=5r/s;

    # --------------------------------------------------------------------------
    # Malicious Scrapers & Bad Bot Filter
    # --------------------------------------------------------------------------
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?i)(sqlmap|nikto|w3af|acunetix|dirbuster|metasploit|scrapy|havij|nmap|zgrab) 1;
    }

    # Upstream Definitions
    upstream express_backend {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_spa {
        server 127.0.0.1:5173;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name zenvdigital.com www.zenvdigital.com;

        # Enforce HTTPS Redirect in production
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name zenvdigital.com www.zenvdigital.com;

        # SSL Configuration (Mount valid certs in deployment)
        ssl_certificate /etc/letsencrypt/live/zenvdigital.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zenvdigital.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # Global Enterprise Security Headers
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Block automated exploitation scanners immediately
        if ($bad_bot = 1) {
            return 403 "Forbidden: Automated scraping disallowed.";
        }

        # ----------------------------------------------------------------------
        # Strict Admin Route Lockdown (Prevent external raw scraping)
        # ----------------------------------------------------------------------
        location /api/admin/ {
            limit_req zone=admin_lockdown burst=5 nodelay;

            # Optional: Allow-list corporate VPN/HQ IPs here
            # allow 198.51.100.0/24;
            # deny all;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Edge-Proxy "Nginx-Zenv-Defense";
        }

        # ----------------------------------------------------------------------
        # Auth Route Brute Force Throttling
        # ----------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_strict burst=3 nodelay;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # General API Gateway Routing
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # ----------------------------------------------------------------------
        # Frontend Single Page Application (SPA)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
