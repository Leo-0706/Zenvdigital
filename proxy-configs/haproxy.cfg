# ==============================================================================
# Zenv Digital - Production HAProxy Edge Hardening Configuration
# ==============================================================================

global
    log /dev/log local0 info
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # Maximum SSL security parameters
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout http-request 10000ms # Mitigate Slowloris DDoS attacks

# ------------------------------------------------------------------------------
# Frontend: Public Edge Listener
# ------------------------------------------------------------------------------
frontend https_in
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/zenvdigital.pem

    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }

    # Track client IP request frequency (Stick-Table)
    stick-table type ip size 100k expire 10m store http_req_rate(10s),conn_cur

    # DDoS & Flood Protection: Deny if more than 60 requests in 10 seconds
    tcp-request content track-sc0 src
    http-request deny deny_status 429 if { sc0_http_req_rate gt 60 }

    # Enterprise Security Headers
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Bad Scraper & Scanner ACLs
    acl bad_scanner req.hdr(User-Agent) -m reg -i (sqlmap|nikto|w3af|acunetix|dirbuster|metasploit|scrapy)
    http-request deny deny_status 403 if bad_scanner

    # Path Routing ACLs
    acl is_api path_beg /api
    acl is_admin_api path_beg /api/admin

    # Extra edge restriction on /api/admin
    # http-request deny if is_admin_api !{ src 10.0.0.0/8 }

    use_backend backend_express if is_api
    default_backend backend_frontend

# ------------------------------------------------------------------------------
# Backend: Express API Cluster
# ------------------------------------------------------------------------------
backend backend_express
    balance roundrobin
    option httpchk GET /api/system/health
    http-check expect status 200
    server express1 127.0.0.1:5000 check maxconn 500

# ------------------------------------------------------------------------------
# Backend: Frontend React SPA
# ------------------------------------------------------------------------------
backend backend_frontend
    balance roundrobin
    server frontend1 127.0.0.1:5173 check
